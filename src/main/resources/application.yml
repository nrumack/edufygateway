server:
  port: 4545

spring:
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: edufy-pod
              uri: http://edufy-pod:8889
              predicates:
                - Path=/api/v1/edufypod/**
            - id: edufy-music
              uri: http://edufy:8888
              predicates:
                - Path=/api/v1/edufymusic/**
            - id: edufy-user-activity
              uri: http://edufy:8787
              predicates:
                - Path=/api/v1/edufyuseractity/**
            - id: edufy-recomandation
              uri: http://edufy:8885
              predicates:
                - Path=/api/v1/edufyrecommendation/**
            - id: edufy-service
              uri: http://edufy:8881
              predicates:
                - Path=/api/v1/videoservice/**