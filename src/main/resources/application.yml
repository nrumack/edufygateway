server:
  port: 4545

spring:
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: podcast
              uri: http://podcast:8889
              predicates:
                - Path=/api/v1/podcast/**
            - id: music
              uri: http://music:8888
              predicates:
                - Path=/api/v1/music/**
            - id: user-activity
              uri: http://user-activity:8787
              predicates:
                - Path=/api/v1/user-activity/**
            - id: recommendation
              uri: http://recommendation:8885
              predicates:
                - Path=/api/v1/recommendation/**
            - id: video
              uri: http://video:8881
              predicates:
                - Path=/api/v1/video/**